    }
    .badge {

    .review-badge { background: #4a2e1e; border-color: #a86b2e; color: #f7b731; }

    .mode-switch {

    }
    .mode-btn {
      flex: 1; background: transparent; border: none;
      color: #7f8ea3; padding: 0.7rem 0.5rem; border-radius: 60px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center;
      justify-content: center; gap: 0.4rem;
    }
    .mode-btn.active {
      background: #0066cc; color: white;
      box-shadow: 0 0 16px #0066cc90;
    }
    .mode-btn:not(.active):hover { background: #1e2a3a; color: #cbd5e1; }

      font-size: 0.7rem; background: #00000040;
      padding: 0.1rem 0.5rem; border-radius: 20px;
    }
    /* 單詞/短語展示區 */
    .word-display {
      background: #0b1622; border-radius: 2rem; padding: 1.4rem 1rem 1.2rem;
      margin-bottom: 1rem; text-align: center;
      border: 1px solid #2d3a4e;
      box-shadow: inset 0 8px 12px rgba(0, 0, 0, 0.6), 0 10px 20px rgba(0, 0, 0, 0.4);
      min-height: 200px; display: flex; flex-direction: column; justify-content: center;
      position: relative;
    }
    .current-word {
      font-size: 3.2rem; font-weight: 700; color: #e2e8f0;
      line-height: 1.25; word-break: break-word; letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0, 200, 255, 0.5);
    }
    .current-word.phrase-mode {
      font-size: 2rem; line-height: 1.4; color: #b9e6ff;
      text-shadow: 0 2px 8px rgba(0, 180, 255, 0.6);
    }
    .translation-display {
      font-size: 1.1rem; color: #94a3b8; margin-top: 0.5rem;
      font-style: italic; letter-spacing: 0.5px; min-height: 1.6rem;
    }
    /* TTS 按鈕 */
    .tts-row {
      display: flex; justify-content: center; gap: 0.6rem;
      margin-top: 0.9rem; flex-wrap: wrap;
    }
    .tts-btn {
      background: #1e3a5f;
      border: 1px solid #3a6a9a;
      color: #b9e6ff;
      padding: 0.5rem 1.1rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s;
      box-shadow: 0 4px 0 #0a1a2a, 0 6px 12px #00000060;
    }
    .tts-btn:hover {
      background: #264e7a;
      box-shadow: 0 4px 0 #0a1a2a, 0 6px 16px #0066cc60;
    }
    .tts-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0a1a2a, 0 6px 12px #00000060;
    }
    .tts-btn.speaking {
      background: #0077ee;
      border-color: #2b8aff;
      color: white;
      animation: pulse 1.2s infinite;
    }
    .tts-btn.slow {
      background: #1e4a3a;
      border-color: #3a8a6a;
      color: #b9ffd9;
    }
    .tts-btn.slow:hover {
      background: #2a6a52;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 4px 0 #0a1a2a, 0 0 0 0 #0066cc80; }
      50% { box-shadow: 0 4px 0 #0a1a2a, 0 0 0 8px #0066cc00; }
    }
    .word-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 0.6rem; color: #7f8ea3; font-size: 0.85rem;
      padding: 0 0.5rem; flex-wrap: wrap; gap: 0.4rem;
    }
    /* 評分區 */
    .score-section {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.8rem; margin: 0.8rem 0 0.4rem; background: #0f1a26;
      border-radius: 60px; padding: 0.4rem 0.4rem 0.4rem 1.2rem;
      border: 1px solid #2d3f55; flex-wrap: wrap;
    }
    .score-label { color: #94a3b8; font-weight: 500; font-size: 0.9rem; }
    .score-badge {
      background: #1e2d3e; border-radius: 40px; padding: 0.4rem 1.2rem;
      font-weight: 700; font-size: 1.4rem; color: #b9e6ff;
      box-shadow: inset 0 2px 6px #00000080, 0 4px 8px #00000040;
      border: 1px solid #3f5569; text-align: center; min-width: 90px;
    }
    .score-value {
      font-weight: 800; color: #4cd964; text-shadow: 0 0 12px #4cd96480;
    }
    .low-score-hint {
      font-size: 0.75rem; color: #f7b731; background: #2a2e1a;
      padding: 0.2rem 0.7rem; border-radius: 20px; border: 1px solid #5e4a1a;
    }
    /* 進度條 */
    .progress-area {
      margin: 0.9rem 0 0.5rem; display: flex; align-items: center; gap: 0.7rem;
    }
    .progress-bar-bg {
      flex: 1; height: 10px; background: #1e2a3a; border-radius: 20px;
      overflow: hidden; box-shadow: inset 0 2px 6px black;
    }
    .progress-fill {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #00c6fb, #00ffb3);
      border-radius: 20px; transition: width 0.25s ease;
      box-shadow: 0 0 10px #00ffb3;
    }
    .counter {
      color: #b9c7d9; font-weight: 500; font-size: 0.85rem;
      background: #1e2a3a; padding: 0.2rem 0.9rem;
      border-radius: 30px; white-space: nowrap;
    }
    /* 控制按鈕 */
    .controls {
      display: flex; flex-wrap: wrap; gap: 0.7rem;
      justify-content: center; margin: 1rem 0 0.6rem;
    }
    .btn {
      border: none; background: #263445; color: #e7edf5;
      font-weight: 600; font-size: 0.95rem; padding: 0.75rem 1.2rem;
      border-radius: 60px; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; gap: 0.4rem;
      transition: all 0.1s; box-shadow: 0 5px 0 #0f141c, 0 6px 14px #00000070;
      border: 1px solid #40546b; flex: 1 1 auto; min-width: 110px;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0f141c, 0 6px 14px #00000070;
    }
    .btn-primary {
      background: #0066cc; border-color: #2b8aff;
      box-shadow: 0 5px 0 #003166, 0 6px 14px #00000090;
      color: white; font-weight: 700;
    }
    .btn-primary:active { box-shadow: 0 1px 0 #003166, 0 6px 14px #00000090; }
    .btn-secondary { background: #2d3b4f; }
    .btn:disabled {
      opacity: 0.4; transform: translateY(4px);
      box-shadow: 0 1px 0 #0f141c, 0 6px 14px #00000070;
      pointer-events: none; filter: grayscale(0.6);
    }
    .status-msg {
      text-align: center; margin: 0.7rem 0 0.2rem; color: #9ab3cc;
      font-size: 0.9rem; min-height: 2.2rem; display: flex;
      align-items: center; justify-content: center; gap: 0.4rem; flex-wrap: wrap;

    .footer-note {

      margin-top: 1rem; border-top: 1px solid #1e2a3a; padding-top: 0.8rem;

    }
    .review-tag { color: #f7b731; font-weight: 600; }

    .tts-settings {

      margin-bottom: 0.8rem; flex-wrap: wrap; align-items: center;
    }

      border-radius: 20px; padding: 0.25rem 0.6rem; font-size: 0.78rem;
      cursor: pointer; outline: none;
    }

    .tts-settings input[type="range"] {
      width: 80px; padding: 0; height: 4px;
      accent-color: #0066cc;
    }
    .pos-tag {
      display: inline-block; background: #1e4a3a; color: #b9ffd9;
      border: 1px solid #3a8a6a; border-radius: 20px; padding: 0 0.6rem;
      font-size: 0.9rem; font-style: normal; margin-right: 0.4rem;

      background: #3a2a12; border: 1px solid #a86b2e; color: #f7d08a;
      font-size: 0.8rem; line-height: 1.5;
    }
    .level-switch { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 0.8rem; }
    .level-btn {
      background: #1e2a3a; color: #94a3b8; border: 1px solid #3f5569;
      border-radius: 40px; padding: 0.35rem 1.1rem; font-size: 0.85rem;
      font-weight: 600; cursor: pointer;
    }
    .level-btn.active { background: #1e4a3a; color: #b9ffd9; border-color: #3a8a6a; }

</head>

<div class="app-container">
  <h1>🎤 英語口說 · 每日20</h1>
  <div class="subhead">
    <span class="badge">📅 今日 <span id="todayCount">0</span>/20</span>

    <span class="badge">📚 <span id="totalProgress">0</span>%</span>
  </div>

  <!-- 模式切換 -->
  <div class="mode-switch">
    <button class="mode-btn active" id="modeWordBtn">📖 單詞 <span class="count-badge" id="wordCountBadge">45</span></button>
    <button class="mode-btn" id="modePhraseBtn">💬 常用短語 <span class="count-badge">500</span></button>
  </div>

  <!-- 難度選擇 -->
  <div class="level-switch" id="levelSwitch">
    <button class="level-btn active" data-level="easy">🌱 初級</button>
    <button class="level-btn" data-level="mid">🌿 中級</button>
    <button class="level-btn" data-level="hard">🌳 高級</button>
  </div>

  <!-- TTS 設置 -->
  <div class="tts-settings">
    <label>🎙️ 語音
      <select id="voiceSelect"></select>
    </label>
    <label>⚡ 語速
      <input type="range" id="rateSlider" min="0.5" max="1.5" step="0.1" value="1.0">
      <span id="rateValue" style="color:#b9e6ff; font-weight:600;">1.0x</span>
    </label>
  </div>

  <!-- 單詞/短語展示區 -->
  <div class="word-display">
    <div class="current-word" id="wordDisplay">apple</div>
    <div class="translation-display" id="translationDisplay"></div>

    <!-- TTS 按鈕行 -->
    <div class="tts-row">
      <button class="tts-btn" id="ttsNormalBtn" title="正常語速朗讀">🔊 聽發音</button>
      <button class="tts-btn slow" id="ttsSlowBtn" title="慢速朗讀">🐢 慢速</button>
    </div>

    <div class="word-meta">
      <span>#<span id="wordIndex">1</span>/20</span>
      <span id="phoneticWrapper">🔊 <span id="wordPhonetic">/ˈæp.əl/</span></span>
      <span id="reviewTag" class="review-tag" style="display:none;">🔁 複習</span>
    </div>
  </div>

  <!-- 評分區域 -->
  <div class="score-section">
    <span class="score-label">本次得分</span>
    <div class="score-badge"><span class="score-value" id="scoreDisplay">—</span></div>
    <span id="lowScoreHint" class="low-score-hint" style="display:none;">低於50分 · 明日複習</span>
  </div>

  <!-- 進度條 -->
  <div class="progress-area">
    <div class="progress-bar-bg"><div class="progress-fill" id="progressFill" style="width: 0%;"></div></div>
    <div class="counter" id="progressCounter">0/20</div>
  </div>

  <!-- 控制按鈕 -->
  <div class="controls">
    <button class="btn btn-primary" id="startBtn">🎤 開始發音</button>
    <button class="btn btn-secondary" id="nextBtn">⏭️ 下一個</button>
    <button class="btn btn-secondary" id="resetBtn">🔄 重置今日</button>
  </div>

  <!-- 狀態訊息 -->
  <div class="status-msg" id="statusMsg"><span>點擊「聽發音」先聽，再點擊「開始發音」練習</span></div>
  <div class="secure-warn" id="secureWarn" style="display:none;"></div>

  <div class="footer-note">
    <span>⚡ 低於50分自動加入明日複習</span>
    <span>🗓️ 每日自動更新20詞</span>
    <span>🔀 單詞/短語獨立進度</span>
    <span>🔊 TTS 發音示範</span>
  </div>
</div>

const STORAGE_KEY = 'english_speaking_dual_mode_tts_v4';

function createModeData() {
  return {
    lastPracticeDate: null,
    todayWords: [],
    todayScores: {},
    reviewWords: [],
    allLowScoreWords: [],
    currentDayIndex: 0,
    totalMastered: 0
  };
}

function getDefaultData() {
  return {
    mode: 'word',
    level: 'easy',
    levelData: { easy: createModeData(), mid: createModeData(), hard: createModeData() },
    phraseData: createModeData(),
    ttsRate: 1.0,
    ttsVoiceName: null
  };
}

let appData = getDefaultData();

function loadData() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      const p = JSON.parse(stored);
      const d = getDefaultData();
      d.mode = p.mode || 'word';
      d.level = WORD_LISTS[p.level] ? p.level : 'easy';
      d.phraseData = { ...createModeData(), ...(p.phraseData || {}) };
      Object.keys(WORD_LISTS).forEach(lv => {
        d.levelData[lv] = { ...createModeData(), ...((p.levelData || {})[lv] || {}) };
      });
      d.ttsRate = typeof p.ttsRate === 'number' ? p.ttsRate : 1.0;
      d.ttsVoiceName = p.ttsVoiceName || null;
      appData = d;
      [...Object.values(appData.levelData), appData.phraseData].forEach(m => {
        if (!Array.isArray(m.todayWords)) m.todayWords = [];
        if (!Array.isArray(m.reviewWords)) m.reviewWords = [];
        if (!Array.isArray(m.allLowScoreWords)) m.allLowScoreWords = [];
        if (typeof m.todayScores !== 'object' || !m.todayScores) m.todayScores = {};
      });
    }
  } catch (e) {
    console.warn('讀取存儲失敗', e);
    appData = getDefaultData();
  }
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }
  catch (e) { console.warn('保存失敗', e); }
}

function getCurrentModeData() {
  return appData.mode === 'word' ? appData.levelData[appData.level] : appData.phraseData;
}

function getCurrentLibrary() {
  return appData.mode === 'word' ? WORD_LISTS[appData.level] : PHRASE_LIST;
}

function getTodayDateStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function isNewDay(modeData) {
  return modeData.lastPracticeDate !== getTodayDateStr();
}

function generateTodayWords(modeData, libraryLength) {
  const reviewPool = [...new Set(modeData.reviewWords)];
  const maxReview = 10;
  const reviewToUse = reviewPool.slice(0, maxReview);

  const usedIndices = new Set(reviewToUse);
  const newWordCount = 20 - reviewToUse.length;
  const newWords = [];

  let startIndex = (modeData.totalMastered || 0) % libraryLength;
  let idx = startIndex;
  let attempts = 0;
  while (newWords.length < newWordCount && attempts < libraryLength * 2) {
    if (!usedIndices.has(idx)) {
      usedIndices.add(idx);
      newWords.push(idx);
    }
    idx = (idx + 1) % libraryLength;
    attempts++;
  }

  let combined = [...reviewToUse, ...newWords];
  while (combined.length < 20) {
    const rand = Math.floor(Math.random() * libraryLength);
    if (!combined.includes(rand)) combined.push(rand);
  }
  for (let i = combined.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [combined[i], combined[j]] = [combined[j], combined[i]];
  }

  modeData.todayWords = combined.slice(0, 20);
  modeData.todayScores = {};
  modeData.currentDayIndex = 0;
  modeData.lastPracticeDate = getTodayDateStr();
  modeData.reviewWords = reviewPool.filter(w => !modeData.todayWords.includes(w));
}

function initDailyDataForMode(modeKey) {
  const isWord = (modeKey === 'wordData' || modeKey === 'word');
  const modeData = isWord ? appData.levelData[appData.level] : appData.phraseData;
  const libraryLength = isWord ? WORD_LISTS[appData.level].length : PHRASE_LIST.length;
  if (isNewDay(modeData) || modeData.todayWords.length === 0) {
    generateTodayWords(modeData, libraryLength);
  } else if (modeData.currentDayIndex >= modeData.todayWords.length) {
    modeData.currentDayIndex = 0;
  }
}

function loadVoices() {
  if (!synth) return;
  voices = synth.getVoices().filter(v => v.lang.startsWith('en'));
  if (voices.length === 0) {
    // 有些流覽器需要延遲載入
    setTimeout(loadVoices, 300);
    return;
  }

  // 填充下拉清單
  voiceSelect.innerHTML = '';
  voices.forEach((voice, i) => {
    const option = document.createElement('option');
    option.value = voice.name;
    option.textContent = `${voice.name} (${voice.lang})${voice.default ? ' ⭐' : ''}`;
    voiceSelect.appendChild(option);
  });

  // 優先選擇之前保存的語音，或預設英語語音
  let savedVoice = null;
  if (appData.ttsVoiceName) {
    savedVoice = voices.find(v => v.name === appData.ttsVoiceName);
  }
  if (!savedVoice) {
    savedVoice = voices.find(v => v.default) || voices[0];
  }
  selectedVoice = savedVoice;
  voiceSelect.value = selectedVoice.name;

  // 設置語速
  rateSlider.value = appData.ttsRate || 1.0;
  rateValue.textContent = (appData.ttsRate || 1.0).toFixed(1) + 'x';
}

// 語速滑塊
rateSlider.addEventListener('input', (e) => {
  const rate = parseFloat(e.target.value);
  rateValue.textContent = rate.toFixed(1) + 'x';
  appData.ttsRate = rate;
  saveData();
});

// 語音選擇
voiceSelect.addEventListener('change', (e) => {
  const name = e.target.value;
  const voice = voices.find(v => v.name === name);
  if (voice) {
    selectedVoice = voice;
    appData.ttsVoiceName = name;
    saveData();
  }
});

// 按鈕視覺回饋
function setTTSButtonState(btn, speaking) {
  if (speaking) btn.classList.add('speaking');
  else btn.classList.remove('speaking');
}

// 朗讀文本
function speak(text, rate, btn) {
  if (!synth) {
    setStatus('⚠️ 當前流覽器不支援語音合成', '❌');
    return;
  }
  // 停止當前朗讀
  synth.cancel();

  // 移除所有按鈕的 speaking 狀態
  ttsNormalBtn.classList.remove('speaking');
  ttsSlowBtn.classList.remove('speaking');

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  if (selectedVoice) utterance.voice = selectedVoice;
  utterance.rate = rate;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;

  utterance.onstart = () => {
    setTTSButtonState(btn, true);
    setStatus(`🔊 正在朗讀：${text}`, '🎧');
  };

  utterance.onend = () => {
    setTTSButtonState(btn, false);
    setStatus('朗讀完成，點擊「開始發音」練習吧', '🎤');
    currentUtterance = null;
  };

  utterance.onerror = (e) => {
    console.warn('TTS 錯誤:', e);
    setTTSButtonState(btn, false);
    setStatus('朗讀出錯，請重試', '❌');
  };

  currentUtterance = utterance;
  synth.speak(utterance);
}

// 獲取當前顯示文本（用於 TTS）
function getCurrentText() {
  const modeData = getCurrentModeData();
  const library = getCurrentLibrary();
  const itemIdx = modeData.todayWords[currentIndex];
  if (itemIdx === undefined) return '';
  const item = library[itemIdx];
  if (!item) return '';
  return appData.mode === 'word' ? item.word : item.en;
}

// 正常語速朗讀
function speakNormal() {
  const text = getCurrentText();
  if (!text) return;
  speak(text, appData.ttsRate || 1.0, ttsNormalBtn);
}

// 慢速朗讀
function speakSlow() {
  const text = getCurrentText();
  if (!text) return;
  // 慢速：使用 0.7 倍基礎速度，且不低於 0.5
  const slowRate = Math.max(0.5, (appData.ttsRate || 1.0) * 0.7);
  speak(text, slowRate, ttsSlowBtn);
}

// ============================================================
// 5. UI 更新
// ============================================================
function updateUI() {
  const modeData = getCurrentModeData();
  const library = getCurrentLibrary();
  const isPhraseMode = appData.mode === 'phrase';
  document.getElementById('levelSwitch').style.display = isPhraseMode ? 'none' : 'flex';
  document.querySelectorAll('.level-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.level === appData.level));
  document.getElementById('wordCountBadge').textContent = WORD_LISTS[appData.level].length;

  if (isPhraseMode) {
    modePhraseBtn.classList.add('active');
    modeWordBtn.classList.remove('active');
  } else {
    modeWordBtn.classList.add('active');
    modePhraseBtn.classList.remove('active');
  }

  wordDisplay.className = 'current-word' + (isPhraseMode ? ' phrase-mode' : '');

  if (modeData.todayWords.length === 0) {
    wordDisplay.textContent = '---';
    return;
  }
  if (currentIndex >= modeData.todayWords.length) currentIndex = 0;

  const itemIdx = modeData.todayWords[currentIndex];
  const item = library[itemIdx];
  if (!item) return;

  if (isPhraseMode) {
    wordDisplay.textContent = item.en;
    translationDisplay.textContent = item.zh;
    phoneticWrapper.style.display = 'none';
  } else {
    wordDisplay.textContent = item.word;
    translationDisplay.innerHTML = item.translation
      ? `<span class="pos-tag">${item.pos}</span>${item.translation}` : '';
    phoneticWrapper.style.display = 'inline';
    wordPhonetic.textContent = item.kk;
  }

  wordIndexSpan.textContent = currentIndex + 1;

  const isReview = modeData.allLowScoreWords.includes(itemIdx);
  reviewTag.style.display = isReview ? 'inline' : 'none';

  const savedScore = modeData.todayScores[itemIdx];
  if (savedScore !== undefined && savedScore !== null) {
    currentScore = savedScore;
    scoreDisplay.textContent = savedScore;
    scoreDisplay.style.color = savedScore >= 80 ? '#4cd964' : (savedScore >= 60 ? '#f7b731' : '#fc5c65');
    lowScoreHint.style.display = savedScore < 50 ? 'inline' : 'none';
  } else {
    currentScore = null;
    scoreDisplay.textContent = '—';
    scoreDisplay.style.color = '#b9e6ff';
    lowScoreHint.style.display = 'none';
  }

  const completed = Object.keys(modeData.todayScores).length;
  const total = modeData.todayWords.length || 20;
  const percent = (completed / total) * 100;
  progressFill.style.width = percent + '%';
  progressCounter.textContent = `${completed}/${total}`;

  todayCountSpan.textContent = completed;
  reviewCountSpan.textContent = modeData.reviewWords.length;
  const libLen = library.length;
  const mastered = libLen - modeData.reviewWords.length;
  const totalPercent = ((Math.max(0, mastered) / libLen) * 100).toFixed(1);
  totalProgressSpan.textContent = totalPercent;

  startBtn.disabled = isListening;
  nextBtn.disabled = isListening;
}

// ============================================================
// 6. 評分與複習邏輯
// ============================================================
function calculateSimilarity(spoken, target) {
  if (!spoken || !target) return 0;
  const s = spoken.trim().toLowerCase();
  const t = target.trim().toLowerCase();
  if (s === t) return 100;
  if (s.length === 0 || t.length === 0) return 0;
  const m = s.length, n = t.length;
  if (Math.abs(m - n) > 6) {
    const maxLen = Math.max(m, n);
    return Math.max(0, 100 - (maxLen * 12));
  }
  const dp = Array(n + 1).fill(0).map((_, i) => i);
  for (let i = 1; i <= m; i++) {
    let prev = dp[0];
    dp[0] = i;
    for (let j = 1; j <= n; j++) {
      const temp = dp[j];
      const cost = s[i - 1] === t[j - 1] ? 0 : 1;
      dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + cost);
      prev = temp;
    }
  }
  const distance = dp[n];
  const maxLen = Math.max(m, n);
  return Math.round(Math.max(0, 100 - (distance / maxLen) * 100));
}

function setStatus(message, emoji = '🎤') {
  statusMsg.innerHTML = `<span>${emoji}</span> ${message}`;
}

function recordScore(itemIdx, score) {
  if (itemIdx === undefined || itemIdx === null) return;
  const modeData = getCurrentModeData();
  const library = getCurrentLibrary();

  modeData.todayScores[itemIdx] = score;

  if (score < 50) {
    if (!modeData.reviewWords.includes(itemIdx)) modeData.reviewWords.push(itemIdx);
    if (!modeData.allLowScoreWords.includes(itemIdx)) modeData.allLowScoreWords.push(itemIdx);
  } else {
    const rIdx = modeData.reviewWords.indexOf(itemIdx);
    if (rIdx !== -1) modeData.reviewWords.splice(rIdx, 1);
  }

  modeData.totalMastered = library.length - modeData.reviewWords.length;
  if (modeData.totalMastered < 0) modeData.totalMastered = 0;

  saveData();
  updateUI();
}

function goToNextWord() {
  if (isListening && recognition) {
    recognition.abort();
    isListening = false;
    updateUI();
  }
  // 停止 TTS
  if (synth) synth.cancel();

  const modeData = getCurrentModeData();

  if (currentIndex < modeData.todayWords.length - 1) {
    currentIndex++;
  } else {
    setStatus('🎉 今日20項已練習完畢！可重置或等待明日更新', '🏆');
    currentIndex = 0;
  }
  modeData.currentDayIndex = currentIndex;
  saveData();

  currentScore = null;
  updateUI();

  const itemIdx = modeData.todayWords[currentIndex];
  if (modeData.todayScores[itemIdx] !== undefined) {
    const sc = modeData.todayScores[itemIdx];
    if (sc >= 90) setStatus(`🎉 之前得分 ${sc}，繼續加油`, '🏅');
    else if (sc >= 60) setStatus(`👍 之前得分 ${sc}，再練一次`, '✨');
    else setStatus(`🔁 之前得分 ${sc}，需要複習`, '💪');
  } else {
    setStatus('點擊「聽發音」先聽，再點擊「開始發音」練習', '🎤');
  }
}

function resetToday() {
  if (isListening && recognition) recognition.abort();
  if (synth) synth.cancel();

  const modeData = getCurrentModeData();
  const library = getCurrentLibrary();

  modeData.todayWords = [];
  modeData.todayScores = {};
  modeData.currentDayIndex = 0;

  generateTodayWords(modeData, library.length);
  saveData();

  currentIndex = 0;
  currentScore = null;
  isListening = false;
  updateUI();
  setStatus('今日內容已重新生成，開始練習吧！', '🔄');
}

function switchLevel(level) {
  if (appData.level === level || !WORD_LISTS[level]) return;
  if (isListening && recognition) { try { recognition.abort(); } catch(e) {} isListening = false; }
  if (synth) synth.cancel();
  appData.level = level;
  initDailyDataForMode('wordData');
  saveData();
  const md = getCurrentModeData();
  currentIndex = md.currentDayIndex || 0;
  if (currentIndex >= md.todayWords.length) currentIndex = 0;
  currentScore = null;
  updateUI();
  setStatus(`已切換到「${LEVEL_NAMES[level]}」難度，先聽發音再練習`, '🎚️');
}

function switchMode(newMode) {
  if (appData.mode === newMode) return;
  if (isListening && recognition) {
    try { recognition.abort(); } catch(e) {}
    isListening = false;
  }
  // 停止 TTS
  if (synth) synth.cancel();

  appData.mode = newMode;
  saveData();

  const modeKey = newMode === 'word' ? 'wordData' : 'phraseData';
  initDailyDataForMode(modeKey);
  saveData();

  const modeData = getCurrentModeData();
  currentIndex = modeData.currentDayIndex || 0;
  if (currentIndex >= modeData.todayWords.length) currentIndex = 0;

  currentScore = null;
  updateUI();

  const itemIdx = modeData.todayWords[currentIndex];
  if (itemIdx !== undefined && modeData.todayScores[itemIdx] !== undefined) {
    const sc = modeData.todayScores[itemIdx];
    if (sc >= 90) setStatus(`🎉 之前得分 ${sc}，複習一次`, '🏅');
    else if (sc >= 60) setStatus(`👍 之前得分 ${sc}，繼續鞏固`, '✨');
    else setStatus(`🔁 之前得分 ${sc}，需要加強`, '💪');
  } else {
    const modeName = newMode === 'word' ? '單詞' : '常用短語';
    setStatus(`已切換到「${modeName}」模式，先聽發音再練習`, '🔀');
  }
}

// ============================================================
// 7. 語音辨識
// ============================================================
function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    setStatus('⚠️ 當前流覽器不支援語音辨識，請使用 Chrome / Edge', '❌');
    startBtn.disabled = true;
    return null;
  }
  const recog = new SpeechRecognition();
  recog.lang = 'en-US';
  recog.interimResults = false;
  recog.maxAlternatives = 1;
  recog.continuous = false;

  recog.onstart = () => {
    isListening = true;
    updateUI();
    setStatus('正在聆聽... 請朗讀', '🎧');
    finalTranscript = '';
  };

  recog.onerror = (event) => {
    console.warn('識別錯誤:', event.error);
    isListening = false;
    updateUI();
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
      micGranted = false;
      if (!window.isSecureContext) showSecureWarning();
      setStatus('🚫 麥克風權限被拒絕，請在網站設定中允許麥克風', '⚠️');
    }
    else if (event.error === 'no-speech') setStatus('⏳ 沒有檢測到語音，請再試一次', '🤔');
    else if (event.error === 'aborted') setStatus('識別已取消', '⏹️');
    else setStatus(`識別出錯: ${event.error}，請重試`, '❌');
  };

  recog.onend = () => {
    isListening = false;
    updateUI();
    if (!finalTranscript) setStatus('沒有聽清，請再試一次', '🔇');
  };

  recog.onresult = (event) => {
    const last = event.results.length - 1;
    const transcript = event.results[last][0].transcript.trim();
    finalTranscript = transcript;

    const modeData = getCurrentModeData();
    const library = getCurrentLibrary();
    const itemIdx = modeData.todayWords[currentIndex];
    if (itemIdx === undefined) return;

    const item = library[itemIdx];
    const target = appData.mode === 'word' ? item.word : item.en;

    const score = calculateSimilarity(transcript, target);
    currentScore = score;
    recordScore(itemIdx, score);

    if (score >= 90) setStatus(`🎉 完美！ "${transcript}" 得分 ${score}`, '🏅');
    else if (score >= 75) setStatus(`👍 很棒！ "${transcript}" 得分 ${score}`, '✨');
    else if (score >= 60) setStatus(`✅ 不錯，再清晰一點會更棒 (得分 ${score})`, '💪');
    else if (score >= 50) setStatus(`📖 及格，但可以更好 (得分 ${score})`, '📚');
    else setStatus(`🔄 低於50分，已加入明日複習 (得分 ${score})`, '🔁');
  };

  return recog;
}

// 麥克風權限：先用 getUserMedia 取得一次授權（需在使用者點擊中呼叫），
// 並用 Permissions API 記錄狀態，已授權就不再重複請求。
let micGranted = false;

async function ensureMicPermission() {
  if (micGranted) return true;
  if (!window.isSecureContext) {
    showSecureWarning();
    setStatus('目前網址不安全，瀏覽器無法記住/取得麥克風權限（見下方說明）', '⚠️');
    return false;
  }
  try {
    if (navigator.permissions && navigator.permissions.query) {
      const p = await navigator.permissions.query({ name: 'microphone' });
      if (p.state === 'granted') { micGranted = true; return true; }
      if (p.state === 'denied') {
        setStatus('麥克風被封鎖：請點網址列左側 🔒 → 權限 → 麥克風 → 允許，再重新整理', '🚫');
        return false;
      }
    }
  } catch (e) { /* 部分瀏覽器不支援 query，改走 getUserMedia */ }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());   // 只為取得授權，立刻釋放麥克風
    micGranted = true;
    await new Promise(r => setTimeout(r, 300));  // Android 需要等麥克風釋放
    return true;
  } catch (e) {
    console.warn('getUserMedia 失敗', e);
    if (e.name === 'NotAllowedError' || e.name === 'SecurityError')
      setStatus('麥克風權限被拒絕：請到瀏覽器網站設定中允許麥克風', '🚫');
    else if (e.name === 'NotFoundError')
      setStatus('找不到麥克風裝置', '🎙️');
    else setStatus(`無法使用麥克風：${e.name}`, '❌');
    return false;
  }
}

function showSecureWarning() {
  const el = document.getElementById('secureWarn');
  el.style.display = 'block';
  el.innerHTML = '⚠️ 目前不是以 HTTPS / localhost 開啟（例如 file:// 或 content://）。' +
    'Chrome 在這種情況下<b>每次都會重新詢問麥克風，Android 甚至完全無法授權</b>。' +
    '請將此檔案放到 HTTPS 網站（GitHub Pages、Netlify、Cloudflare Pages 皆可免費）' +
    '，電腦上也可用 <code>python -m http.server</code> 後開 http://localhost:8000 。';
}

async function startListening() {
  if (!recognition) { setStatus('語音辨識不可用', '❌'); return; }
  if (isListening) { recognition.stop(); return; }

  // 停止 TTS（避免干擾錄音；Android 上 TTS 會佔用音訊焦點）
  if (synth) synth.cancel();

  setStatus('準備中...', '⏳');
  const ok = await ensureMicPermission();
  if (!ok) return;

  finalTranscript = '';
  try { recognition.start(); }
  catch (error) {
    console.error('啟動失敗:', error);
    try {
      recognition.abort();
      setTimeout(() => { try { recognition.start(); } catch(e) {} }, 200);
    } catch(e) {}
  }
}

// ============================================================
// 8. 初始化
// ============================================================
function init() {
  loadData();

  initDailyDataForMode('wordData');
  initDailyDataForMode('phraseData');

  const modeData = getCurrentModeData();
  currentIndex = modeData.currentDayIndex || 0;
  if (currentIndex >= modeData.todayWords.length) currentIndex = 0;

  recognition = initSpeechRecognition();
  if (!window.isSecureContext) showSecureWarning();

  // TTS 初始化
  if (!synth) {
    setStatus('⚠️ 當前流覽器不支援語音合成', '❌');
    ttsNormalBtn.disabled = true;
    ttsSlowBtn.disabled = true;
  } else {
    loadVoices();
    // 某些流覽器需要等 voiceschanged 事件
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }
  }

  // 事件綁定
  startBtn.addEventListener('click', startListening);
  nextBtn.addEventListener('click', goToNextWord);
  resetBtn.addEventListener('click', resetToday);
  document.querySelectorAll('.level-btn').forEach(b =>
    b.addEventListener('click', () => switchLevel(b.dataset.level)));
  modeWordBtn.addEventListener('click', () => switchMode('word'));
  modePhraseBtn.addEventListener('click', () => switchMode('phrase'));
  ttsNormalBtn.addEventListener('click', speakNormal);
  ttsSlowBtn.addEventListener('click', speakSlow);

  // 空白鍵快捷發音（可選）
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'BUTTON') {
      e.preventDefault();
      speakNormal();
    }
  });

  updateUI();

  const itemIdx = modeData.todayWords[currentIndex];
  if (itemIdx !== undefined && modeData.todayScores[itemIdx] !== undefined) {
    const sc = modeData.todayScores[itemIdx];
    if (sc >= 90) setStatus(`🎉 之前得分 ${sc}，複習一次`, '🏅');
    else if (sc >= 60) setStatus(`👍 之前得分 ${sc}，繼續鞏固`, '✨');
    else setStatus(`🔁 之前得分 ${sc}，需要加強`, '💪');
  } else {
    setStatus('點擊「聽發音」先聽，再點擊「開始發音」練習', '🎤');
  }

  window.addEventListener('beforeunload', () => {
    if (recognition) { try { recognition.abort(); } catch(e) {} }
    if (synth) synth.cancel();
  });
}

window.addEventListener('DOMContentLoaded', init);
